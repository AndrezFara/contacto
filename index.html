<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrés Fara | Tarjeta Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f2f2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #1c1c1e;
    }
    .card {
      background: #ffffff;
      padding: 36px 24px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 340px;
      width: 100%;
    }
    .avatar-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      border: 3px solid #ffffff;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: #636366;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #007aff;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.2);
    }
    .btn-secondary {
      background-color: #25d366;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.2);
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Tu foto subida como foto.jpg -->
    <img src="foto.jpg" alt="Andrés Fara" class="avatar-img">

    <h1>Andrés Fara</h1>
    <p>Consultor de Marca & Marketing</p>

    <!-- Descarga directa de la vCard en la agenda -->
    <a href="contacto.vcf" download class="btn">Guardar contacto</a>

    <!-- Enlace a tu WhatsApp -->
    <a href="https://wa.me/51XXXXXXXXX" target="_blank" class="btn btn-secondary">WhatsApp</a>
  </div>

</body>
</html>
